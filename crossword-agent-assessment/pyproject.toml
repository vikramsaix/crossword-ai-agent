[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossword-agent"
version = "0.1.0"
description = "Provider-neutral hybrid crossword solver using clue candidates and CSP crossings"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
crossword-agent = "crossword_agent.cli:main"

[tool.setuptools.packages.find]
include = ["crossword_agent*"]
